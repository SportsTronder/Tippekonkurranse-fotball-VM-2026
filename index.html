<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VM 2026 – Tippeskjema</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:#222;background:#f5f5f3;padding:1rem}
h1{font-size:22px;font-weight:500;margin-bottom:1.25rem;text-align:center;color:#111}
h2{font-size:15px;font-weight:500;margin-bottom:0.6rem;color:#111}
h3{font-size:13px;font-weight:500;margin-bottom:0.4rem;color:#555}
.section{background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:1rem 1.25rem;margin-bottom:0.75rem}
.group-grid{display:grid;grid-template-columns:1fr;gap:0.75rem;margin-bottom:0.75rem}@media(min-width:560px){.group-grid{grid-template-columns:1fr 1fr}}@media(min-width:820px){.group-grid{grid-template-columns:1fr 1fr 1fr}}
.group-card{background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:0.75rem}
.group-header{font-size:14px;font-weight:600;margin-bottom:0.6rem;padding-bottom:0.4rem;border-bottom:1px solid rgba(0,0,0,0.1);color:#111}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:3px 5px;color:#666;font-weight:400;border-bottom:1px solid rgba(0,0,0,0.1)}
td{padding:3px 5px;border-bottom:1px solid rgba(0,0,0,0.05)}
select{font-size:12px;padding:2px 4px;border:1px solid rgba(0,0,0,0.25);border-radius:6px;background:#f0f0ee;color:#222;cursor:pointer}
.match-sel{width:58px}
.pos1{background:rgba(250,200,60,0.18)}
.pos2{background:rgba(80,180,80,0.15)}
.pos3{background:rgba(80,140,220,0.12)}
.tabs{display:flex;gap:4px;margin-bottom:0.75rem;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;font-size:13px;background:#f0f0ee;color:#222;user-select:none}
.tab:hover{background:#e5e5e3}
.tab.active{background:#dbeeff;border-color:#378add;color:#185fa5;font-weight:500}
.nav-row{display:flex;align-items:center;gap:8px;margin-bottom:0.75rem;flex-wrap:wrap}
.nav-btn{padding:5px 14px;border:1px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;font-size:12px;background:#fff;color:#222}
.nav-btn:hover:not(:disabled){background:#f0f0ee}
.nav-btn:disabled{opacity:0.35;cursor:default}
.page-ind{font-size:12px;color:#666;padding:0 6px}
.msg-ok{background:#eaf3de;color:#3b6d11;font-size:12px;padding:5px 8px;border-radius:7px;margin-top:5px;border:1px solid rgba(59,109,17,0.2)}
.msg-warn{background:#fef9e7;color:#7a5000;font-size:12px;padding:5px 8px;border-radius:7px;margin-top:5px;border:1px solid rgba(186,140,0,0.3)}
.msg-warn-top{background:#fef9e7;color:#7a5000;font-size:12px;padding:6px 10px;border-radius:7px;margin-bottom:8px;border:1px solid rgba(186,140,0,0.3)}
.ko-match{display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:5px 8px;background:#f5f5f3;border-radius:8px;flex-wrap:wrap}
.ko-label{font-size:11px;color:#666;min-width:60px;font-weight:500}
.ko-team{font-size:12px;min-width:90px;color:#222}
.ko-vs{font-size:11px;color:#999}
.ko-sel{font-size:12px;padding:2px 5px;border:1px solid rgba(0,0,0,0.2);border-radius:6px;background:#fff;color:#222;cursor:pointer;min-width:110px}
.btn-export{padding:10px 24px;background:#eaf3de;border:1px solid #639922;color:#3b6d11;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
.btn-export:hover{background:#d8eccc}
.round-title{font-size:14px;font-weight:500;margin:0.9rem 0 0.5rem;padding-top:0.6rem;border-top:1px solid rgba(0,0,0,0.08);color:#111}
.round-title:first-child{border-top:none;margin-top:0}
.champ-banner{background:#fff8e1;border:1px solid rgba(186,117,23,0.3);border-radius:8px;padding:10px 16px;margin-top:10px;text-align:center;font-size:14px;color:#5a3a00}
.st-wrap{margin-top:6px}
.st-header{display:flex;align-items:center;gap:4px;padding:2px 4px;font-size:11px;color:#888;margin-bottom:2px}
.standing-row{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:6px;border-bottom:1px solid rgba(0,0,0,0.05);font-size:12px;transition:background 0.12s}
.standing-row.draggable{cursor:grab;user-select:none}
.standing-row.draggable:hover{background:rgba(0,0,0,0.03)}
.standing-row.dragging{opacity:0.35}
.standing-row.drag-over{outline:2px dashed #378add;background:rgba(55,138,221,0.08)!important}
.drag-handle{color:#ccc;font-size:14px;width:16px;flex-shrink:0;text-align:center;line-height:1}
.standing-row.draggable .drag-handle{color:#aaa}
.st-pos{width:16px;font-size:11px;color:#888;flex-shrink:0;text-align:center}
.st-team{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-wdl{font-size:11px;color:#888;width:42px;text-align:right;flex-shrink:0}
.st-pts{width:22px;text-align:right;font-weight:600;color:#333;flex-shrink:0}
.thirds-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:0.5rem}
.thirds-table th{text-align:left;padding:4px 6px;color:#666;font-weight:400;border-bottom:1px solid rgba(0,0,0,0.12);font-size:11px}
.thirds-table td{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,0.06)}
.thirds-table .draggable-row{cursor:grab}
.thirds-table .draggable-row:hover td{background:rgba(0,0,0,0.02)}
.thirds-table .dragging-row{opacity:0.35}
.thirds-table .drag-over-row td{background:rgba(55,138,221,0.1)!important;outline:2px dashed #378add}
.top8-badge{display:inline-block;background:#dbeeff;color:#185fa5;border-radius:4px;font-size:10px;padding:1px 5px;font-weight:500}
.combo-info{background:#f5f5f3;border-radius:8px;padding:8px 12px;font-size:12px;margin-top:0.75rem;line-height:1.8}
.combo-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:1px;font-size:12px}
.combo-label{color:#666;min-width:170px}
.combo-team{font-weight:500;color:#111}
.bonus-card{background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:12px;padding:0.9rem 1.1rem;margin-bottom:0.65rem}
.bonus-title{font-size:13px;font-weight:600;color:#111;margin-bottom:3px}
.bonus-desc{font-size:11px;color:#666;margin-bottom:8px;line-height:1.5}
.bonus-fields{display:flex;flex-direction:column;gap:6px}
.bonus-field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bonus-label{font-size:12px;color:#555;min-width:130px;flex-shrink:0}
.bonus-input{font-size:12px;padding:4px 8px;border:1px solid rgba(0,0,0,0.2);border-radius:7px;background:#fff;color:#222;min-width:160px;flex:1;max-width:280px}
.bonus-input:focus{outline:none;border-color:#378add;box-shadow:0 0 0 2px rgba(55,138,221,0.15)}
.bottom-nav{display:flex;align-items:center;justify-content:space-between;margin-top:1rem;padding-top:0.75rem;border-top:1px solid rgba(0,0,0,0.08)}
.tab-nav-btn{padding:8px 18px;border:1px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;font-size:13px;background:#fff;color:#222;display:flex;align-items:center;gap:5px}
.tab-nav-btn:hover{background:#f0f0ee}
.tab-nav-btn.primary{background:#dbeeff;border-color:#378add;color:#185fa5}
.tab-nav-btn.primary:hover{background:#cce3f8}
.tab-indicator{font-size:12px;color:#888}
/* Validation modal */
.val-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1001;display:flex;align-items:center;justify-content:center;padding:1rem}
.val-modal{background:#fff;border-radius:14px;padding:1.25rem 1.5rem;max-width:480px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.2)}
.val-modal h3{font-size:15px;font-weight:600;margin-bottom:0.75rem;color:#111}
.val-section{margin-bottom:0.75rem}
.val-section-title{font-size:12px;font-weight:600;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.03em}
.val-item{font-size:12px;color:#a32d2d;padding:3px 0 3px 12px;position:relative}
.val-item::before{content:"•";position:absolute;left:2px}
.val-btns{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
.val-btn-back{padding:8px 16px;border:1px solid rgba(0,0,0,0.2);border-radius:8px;cursor:pointer;font-size:13px;background:#fff;color:#222}
.val-btn-back:hover{background:#f0f0ee}
.val-btn-send{padding:8px 16px;border:1px solid #639922;border-radius:8px;cursor:pointer;font-size:13px;background:#eaf3de;color:#3b6d11;font-weight:500}
.val-btn-send:hover{background:#d8eccc}
.bonus-field-err{font-size:11px;color:#a32d2d;margin-top:3px;padding-left:2px}
/* Help modal */
.help-btn{position:absolute;top:0;right:0;width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,0.18);background:#f0f0ee;color:#666;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;flex-shrink:0}
.help-btn:hover{background:#e0e0de;color:#333}
.tab-header{position:relative;display:flex;align-items:center;margin-bottom:0.75rem}
.tab-header h2{margin:0;flex:1}
.help-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.help-modal{background:#fff;border-radius:14px;padding:1.25rem 1.5rem;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;position:relative;box-shadow:0 8px 40px rgba(0,0,0,0.18)}
.help-modal h3{font-size:15px;font-weight:600;margin-bottom:0.75rem;color:#111}
.help-modal p{font-size:13px;color:#333;line-height:1.65;margin-bottom:0.75rem}
.help-modal p:last-child{margin-bottom:0}
.help-modal strong{color:#111}
.help-close{position:absolute;top:0.75rem;right:1rem;font-size:18px;cursor:pointer;color:#aaa;line-height:1;background:none;border:none;padding:2px 6px}
.help-close:hover{color:#333}
/* Clickable group matches */
.gm-row{display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:12px}
.gm-num{color:#bbb;font-size:10px;text-align:right;flex-shrink:0;min-width:18px}
.gm-team{padding:4px 7px;border-radius:6px;border:1px solid rgba(0,0,0,0.1);cursor:pointer;background:#f9f9f7;text-align:center;transition:background 0.1s;white-space:nowrap;user-select:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.gm-team:hover{background:rgba(55,138,221,0.1);border-color:rgba(55,138,221,0.3)}
.gm-team.gm-win{background:rgba(72,168,72,0.18);border-color:rgba(72,168,72,0.4);font-weight:600;color:#1d5c1d}
.gm-team.gm-lose{background:#f9f9f7;color:#ccc;border-color:rgba(0,0,0,0.06)}
.gm-ubtn{padding:4px 6px;border-radius:6px;border:1px solid rgba(0,0,0,0.12);cursor:pointer;background:#f0f0ee;font-size:11px;color:#777;flex-shrink:0;transition:background 0.1s;user-select:none;line-height:1.25;align-self:stretch;display:flex;align-items:center}
.gm-ubtn:hover{background:#e8e8e6;color:#444}
.gm-ubtn.gm-uactive{background:rgba(250,180,0,0.2);border-color:rgba(200,140,0,0.4);color:#7a5000;font-weight:600}
/* Bracket */
.bk-scroll-wrap{overflow-x:auto;padding-bottom:0.5rem;-webkit-overflow-scrolling:touch}
.bk-bracket{display:flex;align-items:center;gap:0;min-width:1000px;padding:0.75rem 0.25rem}
.bk-col-label{font-size:9px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.05em;text-align:center;padding:2px 4px 5px;margin-bottom:2px}
.bk-match{background:#fff;border:1px solid rgba(0,0,0,0.14);border-radius:7px;overflow:hidden;flex-shrink:0;width:128px}
.bk-match-label{font-size:9px;color:#bbb;padding:2px 6px 1px;background:#fafafa;border-bottom:1px solid rgba(0,0,0,0.06);white-space:nowrap}
.bk-team{font-size:11px;padding:5px 6px;cursor:pointer;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(0,0,0,0.05);transition:background 0.1s;user-select:none}
.bk-team:last-child{border-bottom:none}
.bk-team:hover{background:rgba(55,138,221,0.09)}
.bk-winner{background:rgba(72,168,72,0.16)!important;font-weight:600;color:#1d5c1d}
.bk-winner:hover{background:rgba(72,168,72,0.24)!important}
.bk-loser{color:#ccc!important}
/* Column layout helpers */
.bk-side{display:flex;align-items:center}
.bk-side.bk-left{flex-direction:row}
.bk-side.bk-right{flex-direction:row-reverse}
.bk-rounds{display:flex;flex-direction:column;align-items:stretch}
.bk-side.bk-right .bk-rounds{align-items:stretch}
/* Each "round" is a column of match slots */
.bk-round{display:flex;flex-direction:column;padding:0 3px}
/* Connector lines between rounds */
.bk-connectors{display:flex;flex-direction:column;justify-content:space-around;width:14px;flex-shrink:0}
.bk-conn-group{display:flex;flex-direction:column;flex:1;justify-content:center;align-items:center;position:relative}
.bk-conn-group::before{content:'';position:absolute;top:25%;bottom:25%;left:50%;width:1px;background:rgba(0,0,0,0.12)}
.bk-conn-group::after{content:'';position:absolute;top:50%;left:50%;width:50%;height:1px;background:rgba(0,0,0,0.12)}
.bk-side.bk-right .bk-conn-group::after{left:0;width:50%}
/* Match slot spacing */
.bk-slot{display:flex;align-items:center;flex:1;padding:4px 0}
/* Final column */
.bk-final-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;flex-shrink:0}
.bk-final-match{width:140px}
.bk-final-match .bk-team{font-size:12px;padding:8px 8px}
.bk-final-label{font-size:9px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:0.05em;text-align:center;padding:2px 4px 5px}
.bk-champ{margin-top:8px;font-size:12px;font-weight:600;color:#5a3a00;background:#fff8e1;border:1px solid rgba(186,117,23,0.3);border-radius:7px;padding:5px 12px;text-align:center;white-space:nowrap}
</style>
</head>

  for(const block of blocks){if(block.length===1){result.push(block[0]);continue;}const bG=block.map(r=>r.group),moB=mo.filter(g=>bG.includes(g)),rest=bG.filter(g=>!moB.includes(g)),rm={};block.forEach(r=>{rm[r.group]=r;});[...moB,...rest].forEach(g=>{if(rm[g])result.push(rm[g]);});}

function validateBonusField(qid,fkey,el){
  const BONUS_NUM_FIELDS={most_goals_game:['goals','match'],most_penalties:['count','match']};
  const mustBeNum=BONUS_NUM_FIELDS[qid]&&BONUS_NUM_FIELDS[qid].includes(fkey);
  if(!mustBeNum)return;
  const val=el.value.trim();
  const existing=el.parentNode.querySelector('.bonus-field-err');
  if(existing)existing.remove();
  if(val===""||/^\d+$/.test(val))return;
  const err=document.createElement('div');
  err.className='bonus-field-err';
  const tip=fkey==='match'?' (kampnummer 1–72 og 73–104 – se henholdsvis gruppe- og sluttspillfanene)':'';
  err.textContent='⚠ Må være et heltall'+tip;
  el.parentNode.appendChild(err);
}

function validateAll(){
  const issues={groups:[],playoff:[],bonus:[]};

  // Groups: check all 6 matches filled per group
  GKS.forEach(g=>{
    const ms=getMatches(GROUPS[g]);
    const missing=ms.filter((_,i)=>!st.groupResults[g][i]).length;
    if(missing>0)issues.groups.push(`Gruppe ${g}: ${missing} kamp${missing>1?"er":""} mangler`);
  });

  // Playoff: check all 31 matches
  ALL_MATCHES.forEach(m=>{
    if(!st.koResults[m.id]){
      const{a,b}=getTeams(m);
      if(a!=="?"&&b!=="?")issues.playoff.push(`${m.label}: ikke tippet`);
    }
  });

  // Bonus: check all fields
  const BONUS_NUM_FIELDS={most_goals_game:['goals','match'],most_penalties:['count','match']};
  BONUS.forEach(q=>{
    const missing=q.fields.filter(f=>!st.bonus[q.id][f.key]||st.bonus[q.id][f.key].trim()==="");
    if(missing.length>0)issues.bonus.push(`${q.title.replace(/^[^ ]+ /,"")}: mangler svar`);
    else{
      const invalid=q.fields.filter(f=>{
        const mustBeNum=BONUS_NUM_FIELDS[q.id]&&BONUS_NUM_FIELDS[q.id].includes(f.key);
        return mustBeNum&&!/^\d+$/.test((st.bonus[q.id][f.key]||"").trim());
      });
      if(invalid.length>0)issues.bonus.push(`${q.title.replace(/^[^ ]+ /,"")}: ${invalid.map(f=>f.label).join(", ")} må være heltall`);
    }
  });

  return issues;
}

function renderKORound(matches,title){
  let html=`<div class="round-title">${title}</div>`;
  for(const m of matches){const{a,b}=getTeams(m),sel=st.koResults[m.id]||"";html+=`<div class="ko-match"><span class="ko-label">${m.label}</span><span class="ko-team">${a}</span><span class="ko-vs">vs</span><span class="ko-team">${b}</span><select class="ko-sel" onchange="setKO('${m.id}',this.value)"><option value="">– velg vinner –</option><option value="A" ${sel==="A"?"selected":""}>${a}</option><option value="B" ${sel==="B"?"selected":""}>${b}</option></select></div>`;}
  return html;
}
function renderPlayoff(){
  const L={r32:['m74','m77','m73','m75','m83','m84','m81','m82'],r16:['m89','m90','m93','m94'],qf:['m97','m98'],sf:['m101']};
  const R={r32:['m76','m78','m79','m80','m86','m88','m85','m87'],r16:['m91','m92','m95','m96'],qf:['m99','m100'],sf:['m102']};
  const MH=54,LBH=22,CW=130,SW=24,STROKE='rgba(0,0,0,0.22)';
  const P32=[0,64,138,202,276,340,414,478];
  const P16=[32,170,308,446];
  const PQF=[101,377];
  const PSF=239;
  const colH=532;

  function mbox(id){
    const m=ALL_MATCHES.find(x=>x.id===id);
    const{a,b}=getTeams(m);const sel=st.koResults[id]||'';
    const aW=sel==='A',bW=sel==='B';
    const ca='bk-team'+(aW?' bk-winner':bW?' bk-loser':'');
    const cb='bk-team'+(bW?' bk-winner':aW?' bk-loser':'');
    return '<div class="bk-match"><div class="bk-match-label">'+m.label+'</div>'+
      '<div class="'+ca+'" data-mid="'+id+'" data-side="A">'+a+'</div>'+
      '<div class="'+cb+'" data-mid="'+id+'" data-side="B">'+b+'</div></div>';
  }

  function col(ids,tops,label){
    let h='<div style="position:relative;width:'+CW+'px;height:'+(colH+LBH)+'px;flex-shrink:0">';
    h+='<div class="bk-col-label" style="text-align:center;width:'+CW+'px">'+label+'</div>';
    ids.forEach((id,i)=>{ h+='<div style="position:absolute;top:'+(LBH+tops[i])+'px;left:0;right:0">'+mbox(id)+'</div>'; });
    return h+'</div>';
  }

  function connSvg(fromTops,toTops,isLeft){
    const H=colH+LBH; let p='';
    toTops.forEach((tt,ti)=>{
      const y1=LBH+fromTops[ti*2]+MH/2, y2=LBH+fromTops[ti*2+1]+MH/2, yt=LBH+tt+MH/2, xm=SW/2;
      if(isLeft){
        p+='<path d="M0,'+y1+' H'+xm+' V'+yt+' H'+SW+'" stroke="'+STROKE+'" stroke-width="1.5" fill="none" stroke-linejoin="round"/>';
        p+='<path d="M0,'+y2+' H'+xm+' V'+yt+'" stroke="'+STROKE+'" stroke-width="1.5" fill="none" stroke-linejoin="round"/>';
      } else {
        p+='<path d="M'+SW+','+y1+' H'+xm+' V'+yt+' H0" stroke="'+STROKE+'" stroke-width="1.5" fill="none" stroke-linejoin="round"/>';
        p+='<path d="M'+SW+','+y2+' H'+xm+' V'+yt+'" stroke="'+STROKE+'" stroke-width="1.5" fill="none" stroke-linejoin="round"/>';
      }
    });
    return '<svg width="'+SW+'" height="'+H+'" style="flex-shrink:0;display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">'+p+'</svg>';
  }

  function sfFinalConn(isLeft){
    const H=colH+LBH, y=LBH+PSF+MH/2;
    const p=isLeft?'<path d="M0,'+y+' H'+SW+'" stroke="'+STROKE+'" stroke-width="1.5" fill="none"/>'
                  :'<path d="M'+SW+','+y+' H0" stroke="'+STROKE+'" stroke-width="1.5" fill="none"/>';
    return '<svg width="'+SW+'" height="'+H+'" style="flex-shrink:0;display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">'+p+'</svg>';
  }

  function side(s,isLeft){
    const cr=col(s.r32,P32,'Sekst.finaler'), s1=connSvg(P32,P16,isLeft);
    const c6=col(s.r16,P16,'Åttedels.'),    s2=connSvg(P16,PQF,isLeft);
    const cq=col(s.qf, PQF,'Kvartfinale'),  s3=connSvg(PQF,[PSF],isLeft);
    const cs=col(s.sf, [PSF],'Semifinale'), s4=sfFinalConn(isLeft);
    return isLeft
      ?'<div style="display:flex;flex-direction:row;align-items:flex-start">'+cr+s1+c6+s2+cq+s3+cs+s4+'</div>'
      :'<div style="display:flex;flex-direction:row-reverse;align-items:flex-start">'+cr+s1+c6+s2+cq+s3+cs+s4+'</div>';
  }

  const champ=getWinner('final');
  const fm=ALL_MATCHES.find(x=>x.id==='final');
  const{a:fa,b:fb}=getTeams(fm);
  const fsel=st.koResults['final']||'';
  const faW=fsel==='A',fbW=fsel==='B';
  const fin='<div style="flex-shrink:0;width:'+(CW+8)+'px;height:'+(colH+LBH)+'px;position:relative">'+
    '<div class="bk-col-label" style="text-align:center">Finale</div>'+
    '<div style="position:absolute;top:'+(LBH+PSF)+'px;left:4px;right:4px">'+
    '<div class="bk-match bk-final-match">'+
    '<div class="bk-match-label">Kamp 104</div>'+
    '<div class="bk-team'+(faW?' bk-winner':fbW?' bk-loser':'')+'" data-mid="final" data-side="A">'+fa+'</div>'+
    '<div class="bk-team'+(fbW?' bk-winner':faW?' bk-loser':'')+'" data-mid="final" data-side="B">'+fb+'</div>'+
    '</div>'+(champ&&champ!=='?'?'<div class="bk-champ">🏆 '+champ+'</div>':'')+'</div></div>';

  return '<div style="position:relative;display:flex;align-items:center;margin-bottom:0.5rem"><h2 style="margin:0;flex:1">Sluttspill</h2><button class="help-btn" onclick="showHelp(\'playoff\')">?</button></div>'+'<div class="bk-scroll-wrap"><div style="display:flex;flex-direction:row;align-items:flex-start;min-width:1120px;padding:0.5rem 0.25rem">'+
    side(L,true)+fin+side(R,false)+'</div></div>';
}
function renderBonus(){
  let html=`<div style="position:relative;display:flex;align-items:center;margin-bottom:0.75rem"><h2 style="margin:0;flex:1">Bonusspørsmål</h2><button class="help-btn" onclick="showHelp('bonus')">?</button></div><p style="font-size:12px;color:#666;margin-bottom:0.75rem">Fyll inn dine svar. Svarene eksporteres sammen med resten av tippingen.</p></div>`;
  BONUS.forEach(q=>{
    html+=`<div class="bonus-card"><div class="bonus-title">${q.title}</div><div class="bonus-desc">${q.desc}</div><div class="bonus-fields">`;
    q.fields.forEach(f=>{const val=(st.bonus[q.id][f.key]||"").replace(/"/g,""");html+=`<div class="bonus-field"><span class="bonus-label">${f.label}:</span><input class="bonus-input" type="text" placeholder="${f.label}..." value="${val}" oninput="setBonus('${q.id}','${f.key}',this.value)" onblur="validateBonusField('${q.id}','${f.key}',this)"></div>`;});
    html+=`</div></div>`;
  });
  return html;
}
function buildExport(){
  clearCache();const lines=["VM 2026 TIPPING","","GRUPPESPILL"];
  GKS.forEach(g=>{lines.push(`\nGruppe ${g}`,"Hjemme\tBorte\tResultat");getMatches(GROUPS[g]).forEach(([a,b],i)=>lines.push(`${a}\t${b}\t${st.groupResults[g][i]||""}`));lines.push("Plass\tLag\tK\tV\tU\tT\tPoeng");calcStandings(g).forEach((s,idx)=>lines.push(`${idx+1}\t${s.team}\t${s.w+s.d+s.l}\t${s.w}\t${s.d}\t${s.l}\t${s.pts}`));});
  lines.push("\nBESTE 3ERE","Rang\tGruppe\tLag\tV\tU\tT\tPoeng\tVidere");getRankedThirds().forEach((t,i)=>lines.push(`${i+1}\tGr. ${t.group}\t${t.team}\t${t.w}\t${t.d}\t${t.l}\t${t.pts}\t${i<8?"Ja":"Nei"}`));
  const key=getComboKey(),asgn=key?TC[key]:null;
  if(asgn){lines.push("\nKOMBINASJONSNØKKEL: "+key,"Kamp\tMot\tGruppe 3er\tLag");["Kamp 79","Kamp 85","Kamp 81","Kamp 74","Kamp 82","Kamp 77","Kamp 87","Kamp 80"].forEach((kamp,i)=>{lines.push(`${kamp}\t${["1A","1B","1D","1E","1G","1I","1K","1L"][i]}\t3${asgn[i]}\t${groupPlacings(asgn[i]).third||""}`);});}
  lines.push("\nSLUTTSPILL","Kamp\tLag A\tLag B\tVinner");ALL_MATCHES.forEach(m=>{const{a,b}=getTeams(m);const sel=st.koResults[m.id]||"";lines.push(`${m.label}\t${a}\t${b}\t${sel==="A"?a:sel==="B"?b:""}`);});
  lines.push("\nBONUSSPØRSMÅL");BONUS.forEach(q=>{lines.push(`\n${q.title}`);q.fields.forEach(f=>lines.push(`${f.label}\t${st.bonus[q.id][f.key]||""}`));});
  return lines.join("\n");
}
const HELP_TEXT={
  groups:`<h3>Gruppespill</h3>
<p>Tipp alle kampene i de 12 gruppene ved å klikke på laget du tror vinner, eller <strong>U</strong> for uavgjort. Klikker du på det samme valget igjen fjernes tipset.</p>
<p>Tabellen oppdateres automatisk etter hvert som du fyller inn kamper.</p>
<p><strong>Lik poengsum:</strong> Dersom to eller flere lag ender på samme poengsum, vil FIFA avgjøre rekkefølgen basert på innbyrdes oppgjør, målforskjell og antall scorede mål – regler vi ikke kan beregne uten å kjenne de faktiske målscorene. Du må derfor dra lagene til den rekkefølgen du <em>tror</em> de vil havne i. Lag som kan dras vises med et ⠿-ikon. Du kan kun dra innenfor grupper av lag med lik poengsum – du kan ikke dra et lag forbi et lag med flere eller færre poeng.</p>`,
  thirds:`<h3>Beste 3ere</h3>
<p>De 8 beste tredjeplasslagene på tvers av alle 12 grupper går videre til sluttspillet. Tabellen viser alle 12 tredjeplasslag rangert etter poeng fra gruppespillet ditt.</p>
<p><strong>Innad i de 8 beste spiller ikke rekkefølgen noen rolle</strong> – det avgjørende er kun <em>hvem</em> de 8 er, ikke hvilken plass de har seg imellom. Kampoppsettet i sluttspillet bestemmes utelukkende av hvilke grupper de 8 treerne kommer fra, ikke av innbyrdes rangering.</p>
<p><strong>Lik poengsum på grensen:</strong> Dersom lag på plass 8 og 9 har samme poengsum, kan du dra dem for å angi hvem du tror FIFA vil rangere høyest. Dra-ikon (⠿) vises kun der rekkefølgen er uavgjort. Du kan ikke dra et lag forbi et lag med flere eller færre poeng.</p>
<p><strong>Kampoppsett:</strong> Når de 8 beste treerne er klare, vises det automatisk hvilken kamp hver av dem spiller i sluttspillet. Dette styres av FIFAs offisielle kombinasjonstabell med 495 mulige utfall – hvilken kombinasjon som gjelder avhenger av hvilke 8 grupper treerne kommer fra. Motstanderne er vinnerne av de respektive gruppene fra gruppespillet ditt.</p>`,
  playoff:`<h3>Sluttspill</h3>
<p>Tipp videre fra sekstendelsfinaler hele veien til finalen ved å klikke på laget du tror vinner hver kamp. Klikker du på det samme laget igjen fjernes valget.</p>
<p>Bracket-treet oppdateres automatisk slik at vinneren av hver kamp føres videre til neste runde. Endrer du et valg i gruppespill eller beste 3ere underveis, nullstilles alle sluttspillkamper som er avhengige av det valget.</p>
<p>Tredjeplasslagenes motstandere og kampnummer hentes automatisk fra kombinasjonstabellen du fylte ut under <strong>Beste 3ere</strong>.</p>`,
  bonus:`<h3>Bonusspørsmål</h3>
<p>Her kan du tippe på individuelle prestasjoner og lagstatistikk gjennom hele turneringen. Svarene eksporteres sammen med resten av tippingen når du er ferdig.</p>
<p>De fleste prisene – Gullstøvelen, Gullhansken og Gullballen – kåres offisielt i forbindelse med finalen. Toppscorer i gruppespillet kåres etter siste gruppespillrunde og er sjelden den samme som den endelige toppscoreren.</p>
<p>For spørsmål der du skal oppgi kampnummer, finner du disse i gruppespilloversikten (kamp 1–72) og sluttspilloversikten (kamp 73–104).</p><p>Når alt er utfylt klikker du <strong>Kopier til utklippstavle</strong>-knappen nederst på bonusspørsmål-siden, limer inn i Excel og sender inn på e-post.</p>`,
};

window.setTab=t=>{lastResetMsg="";const firstVisit=!seenTabs.has(t);seenTabs.add(t);st.tab=t;render();if(firstVisit)showHelp(t);}
window.prevPage=()=>{st.groupPage=Math.max(0,st.groupPage-1);render();}
window.nextPage=()=>{st.groupPage=Math.min(Math.ceil(GKS.length/GPP)-1,st.groupPage+1);render();}
window.setGR=(g,i,v)=>{const before={...groupPlacings(g)};st.groupResults[g][i]=v||null;manualOrder[g]=null;const after=groupPlacings(g);if(before.winner!==after.winner||before.second!==after.second||before.third!==after.third){st._prevPlacings[g]={...after};const{ko}=cascadeReset([g]);lastResetMsg=ko>0?`⚠ Plasseringer i gruppe ${g} endret – nullstilte ${ko} sluttspillkamper.`:"";}else lastResetMsg="";render();};
window.bkClick=(id,side)=>{
  const old=st.koResults[id];
  // Save bracket scroll position before re-render
  const bkWrap=document.querySelector('.bk-scroll-wrap');
  const savedScroll=bkWrap?bkWrap.scrollLeft:0;
  // Toggle: click same side again to deselect
  st.koResults[id]=(old===side)?null:side;
  if(old!==st.koResults[id]){
    const aff=koMatchesDependingOn([id]);let ko=0;
    aff.forEach(mid=>{if(st.koResults[mid]){st.koResults[mid]=null;ko++;}});
    lastResetMsg=ko>0?`⚠ Kampresultat endret – nullstilte ${ko} kamper nedstrøms.`:"";
  }
  render();
  // Restore scroll position after re-render
  const bkWrapNew=document.querySelector('.bk-scroll-wrap');
  if(bkWrapNew)bkWrapNew.scrollLeft=savedScroll;
};
window.setKO=(id,v)=>{const old=st.koResults[id];st.koResults[id]=v||null;if(old!==v){const aff=koMatchesDependingOn([id]);let ko=0;aff.forEach(mid=>{if(st.koResults[mid]){st.koResults[mid]=null;ko++;}});lastResetMsg=ko>0?`⚠ Kampresultat endret – nullstilte ${ko} kamper nedstrøms.`:""}render();};
window.setBonus=(qid,fkey,val)=>{st.bonus[qid][fkey]=val;};
window.doExport=()=>{const d=buildExport();navigator.clipboard.writeText(d).then(()=>alert("Kopiert! Lim inn i Excel med Ctrl+V.")).catch(()=>{const ta=document.createElement("textarea");ta.value=d;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("Kopiert! Lim inn i Excel med Ctrl+V.");});};
snapshotPlacings();render();showHelp('groups');seenTabs.add('groups');
window.exportData=()=>showValidation();
</script>
